name: CI

permissions:
  contents: read
  packages: write

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run CI-safe tests
        run: python -m pytest tests/ -v -m "not model"

      - name: Build Docker image
        run: docker build -t image-captioning-api .

      - name: Run Docker container
        run: |
          docker run -d \
            --name image-captioning-api \
            -p 8000:8000 \
            image-captioning-api

      - name: Test Docker health endpoint
        run: |
          sleep 5
          curl --fail http://localhost:8000/health

      - name: Stop Docker container
        if: always()
        run: docker rm -f image-captioning-api

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag image-captioning-api \
            ghcr.io/jimhuang711218/image-captioning-pytorch:latest

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/jimhuang711218/image-captioning-pytorch:latest